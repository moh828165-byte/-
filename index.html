<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#7c3aed">
    <title>مول الصعيدي - النظام الشامل</title>
    <!-- مكتبة قراءة الباركود عبر الكاميرا -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: system-ui, sans-serif; background: #f5f3ff;
            color: #211b2d; padding: 16px; max-width: 720px; margin-inline: auto;
        }
        h1 { margin: 4px 0 16px; font-size: 24px; color: #6d28d9; text-align: center; }
        
        /* شريط التنقل بين الشاشات */
        .nav-tabs {
            display: flex; gap: 4px; background: #ede9fe; padding: 6px;
            border-radius: 14px; margin-bottom: 16px; overflow-x: auto;
        }
        .nav-tabs button {
            flex: 1; min-height: 40px; padding: 8px 10px; font-size: 13px;
            background: transparent; color: #5b21b6; border: none; border-radius: 10px;
            font-weight: bold; cursor: pointer; white-space: nowrap;
        }
        .nav-tabs button.active {
            background: #7c3aed; color: white; box-shadow: 0 2px 8px rgba(124, 58, 237, 0.3);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        section {
            background: white; padding: 16px; border-radius: 16px;
            box-shadow: 0 3px 14px rgba(0,0,0,0.06); margin-bottom: 16px;
        }
        h2 { font-size: 18px; margin: 0 0 12px; color: #5b21b6; }
        
        input, button, select {
            width: 100%; min-height: 48px; margin: 6px 0; padding: 10px 14px;
            border: 1px solid #ddd6e8; border-radius: 12px; font-size: 16px; background: #fff;
        }
        button {
            background: #7c3aed; color: white; border: none; font-weight: bold; cursor: pointer;
        }
        button:active { background: #6d28d9; }
        .btn-danger { background: #ef4444; }
        .btn-success { background: #10b981; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-info { background: #3b82f6; color: white; }
        .btn-whatsapp { background: #25d366; color: white; }
        .row { display: flex; gap: 8px; }
        
        .invoice-card {
            border: 1px solid #e9d5ff; padding: 12px; border-radius: 12px; margin-bottom: 10px; background: #faf5ff;
        }
        .invoice-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 6px; }
        .item-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #f3e8ff; font-size: 14px; align-items: center; }
        .report-box { background: #f3e8ff; border: 1px solid #c084fc; padding: 12px; border-radius: 12px; margin-top: 10px; }
        
        .videoContainer { display: none; width: 100%; max-height: 250px; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 10px; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <h1>مول الصعيدي 🛒</h1>

    <!-- شريط الأزرار للانتقال بين الشاشات -->
    <div class="nav-tabs">
        <button id="tabBtn-cashier" class="active" onclick="switchTab('cashier')">🛒 الكاشير</button>
        <button id="tabBtn-inventory" onclick="switchTab('inventory')">📦 المخزن</button>
        <button id="tabBtn-daily" onclick="switchTab('daily')">📅 الفواتير اليومية</button>
        <button id="tabBtn-reports" onclick="switchTab('reports')">📊 كشف الحساب</button>
    </div>

    <!-- 1. شاشة الكاشير والفاتورة -->
    <div id="tab-cashier" class="tab-content active">
        <section>
            <h2>شاشة البيع والفاتورة</h2>
            
            <div class="row">
                <input type="text" id="clientName" placeholder="اسم العميل">
                <input type="text" id="clientPhone" placeholder="رقم الهاتف">
            </div>

            <div id="videoContainer-cashier" class="videoContainer">
                <video id="interactive-cashier" muted autoplay></video>
                <button class="btn-danger" style="position: absolute; bottom: 10px; left: 10px; width: auto; min-height: 36px; padding: 0 16px;" onclick="stopCamera('cashier')">إغلاق الكاميرا</button>
            </div>
            <button class="btn-info" onclick="startCamera('cashier')">📷 مسح الباركود بالكاميرا للبيع</button>

            <input type="text" id="searchBarcode" placeholder="ابحث بالباركود أو اسم الصنف..." oninput="filterAndAddProduct()">
            <select id="productSelect" onchange="addProductToCart()"></select>
            
            <div id="cartList" style="margin-top: 10px;"></div>
            
            <div style="background: #faf5ff; padding: 12px; border-radius: 12px; margin-top: 10px; border: 1px solid #e9d5ff;">
                <div class="row">
                    <div style="flex: 1;">
                        <label style="font-size: 13px; font-weight: bold; color: #5b21b6; display: block; margin-bottom: 2px;">قيمة الخصم (ج.م):</label>
                        <input type="number" id="discountVal" placeholder="0" oninput="renderCart()" value="0">
                    </div>
                    <div style="flex: 1;">
                        <label style="font-size: 13px; font-weight: bold; color: #10b981; display: block; margin-bottom: 2px;">المبلغ المدفوع (ج.م):</label>
                        <input type="number" id="paidVal" placeholder="0" oninput="renderCart()" value="0">
                    </div>
                </div>
                
                <div id="invoiceSummary" style="font-size: 15px; margin-top: 10px; line-height: 1.6; border-top: 1px dashed #d8b4fe; padding-top: 8px;">
                    إجمالي الأصناف: 0 ج.م<br>
                    الخصم: 0 ج.م<br>
                    <b style="color: #7c3aed; font-size: 17px;">الإجمالي النهائي: 0 ج.م</b><br>
                    <b style="color: #10b981; font-size: 17px;">المتبقي / الباقي (السالب): 0 ج.م</b>
                </div>
            </div>

            <button onclick="checkoutInvoice()" style="margin-top: 12px;">إتمام وحفظ الفاتورة</button>
        </section>
    </div>

    <!-- 2. شاشة المخزن -->
    <div id="tab-inventory" class="tab-content">
        <section>
            <h2>إدارة المخزن والأصناف</h2>
            <div id="videoContainer-inventory" class="videoContainer">
                <video id="interactive-inventory" muted autoplay></video>
                <button class="btn-danger" style="position: absolute; bottom: 10px; left: 10px; width: auto; min-height: 36px; padding: 0 16px;" onclick="stopCamera('inventory')">إغلاق الكاميرا</button>
            </div>
            <button class="btn-info" onclick="startCamera('inventory')">📷 فتح الكاميرا لمسح الباركود</button>
            
            <input type="text" id="pBarcode" placeholder="باركود الصنف (يظهر تلقائياً عند المسح)">
            <input type="text" id="pName" placeholder="اسم الصنف">
            <div class="row">
                <input type="number" id="pPrice" placeholder="السعر">
                <input type="number" id="pQty" placeholder="العدد المراد إضافته (أو تعديله)">
            </div>
            <button class="btn-success" onclick="saveProduct()">حفظ الصنف أو تحديث كميته مباشرة</button>
            
            <h3 style="margin-top: 20px; color: #5b21b6;">قائمة الأصناف الحالية بالمخزن</h3>
            <div id="inventoryList"></div>
        </section>
    </div>

    <!-- 3. شاشة الفواتير اليومية (تعديل + حذف + واتساب) -->
    <div id="tab-daily" class="tab-content">
        <section>
            <h2>الفواتير اليومية</h2>
            <label style="display:block; margin-bottom:6px; font-weight:bold;">اختر التاريخ:</label>
            <input type="date" id="dailyDate" onchange="renderDailyInvoices()">
            <div id="dailyInvoicesContainer" style="margin-top: 10px;"></div>
        </section>
    </div>

    <!-- 4. شاشة كشف الحساب والتقارير (محمية بكلمة سر 1760) -->
    <div id="tab-reports" class="tab-content">
        <section>
            <h2>📊 كشف الحساب والتقارير (محمي)</h2>
            <div id="passSection">
                <input type="password" id="reportPass" placeholder="أدخل كلمة السر (1760)">
                <button class="btn-warning" onclick="unlockReports()">فتح كشف الحساب</button>
            </div>

            <div id="reportsContent" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h3 style="margin: 0; color: #6d28d9;">ملخص التقارير اليومية والشهرية</h3>
                    <button class="btn-danger" style="width: auto; min-height: 36px; padding: 4px 12px;" onclick="lockReports()">قفل</button>
                </div>
                
                <label style="display:block; margin-top:10px; font-weight:bold;">اختر التاريخ للتقرير:</label>
                <input type="date" id="reportDate" onchange="generateReport()">

                <div id="reportResult" class="report-box">
                    اختر تاريخاً لعرض تفاصيل الحساب.
                </div>
            </div>
        </section>
    </div>

    <script>
        const REPORT_PASSWORD = "1760";

        let products = JSON.parse(localStorage.getItem('products') || '[]');
        let cart = [];
        let invoices = JSON.parse(localStorage.getItem('invoices') || '[]');
        let codeReader = null;
        let editingInvoiceId = null;

        function switchTab(tabId) {
            stopCamera('cashier');
            stopCamera('inventory');
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-tabs button').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).classList.add('active');
            document.getElementById('tabBtn-' + tabId).classList.add('active');

            if(tabId === 'inventory') renderInventoryList();
            if(tabId === 'daily') {
                document.getElementById('dailyDate').valueAsDate = new Date();
                renderDailyInvoices();
            }
        }

        function startCamera(mode) {
            let containerId = mode === 'cashier' ? 'videoContainer-cashier' : 'videoContainer-inventory';
            let videoId = mode === 'cashier' ? 'interactive-cashier' : 'interactive-inventory';

            document.getElementById(containerId).style.display = 'block';
            codeReader = new ZXing.BrowserBarcodeReader();
            codeReader.decodeFromVideoDevice(null, videoId, (result, err) => {
                if (result) {
                    let scannedCode = result.text;
                    if(mode === 'inventory') {
                        document.getElementById('pBarcode').value = scannedCode;
                        let existing = products.find(p => p.barcode === scannedCode);
                        if(existing) {
                            document.getElementById('pName').value = existing.name;
                            document.getElementById('pPrice').value = existing.price;
                            alert('تم التعرف على الصنف: ' + existing.name);
                        } else {
                            alert('باركود جديد: ' + scannedCode + ' - أدخل اسمه وسعره لحفظه');
                        }
                    } else if(mode === 'cashier') {
                        let found = products.find(p => p.barcode === scannedCode);
                        if(found) {
                            let cartItem = cart.find(c => c.id == found.id);
                            if(cartItem) cartItem.qty++;
                            else cart.push({ ...found, qty: 1 });
                            renderCart();
                            alert('تمت إضافة: ' + found.name);
                        } else {
                            alert('هذا الباركود غير مسجل بالمخزن: ' + scannedCode);
                        }
                    }
                    stopCamera(mode);
                }
            }).catch(err => console.error(err));
        }

        function stopCamera(mode) {
            if(codeReader) codeReader.reset();
            let containerCashier = document.getElementById('videoContainer-cashier');
            let containerInv = document.getElementById('videoContainer-inventory');
            if(containerCashier) containerCashier.style.display = 'none';
            if(containerInv) containerInv.style.display = 'none';
        }

        function unlockReports() {
            let pass = document.getElementById('reportPass').value;
            if(pass === REPORT_PASSWORD) {
                document.getElementById('passSection').style.display = 'none';
                document.getElementById('reportsContent').style.display = 'block';
                document.getElementById('reportDate').valueAsDate = new Date();
                generateReport();
            } else {
                alert('كلمة السر غير صحيحة!');
            }
        }

        function lockReports() {
            document.getElementById('passSection').style.display = 'block';
            document.getElementById('reportsContent').style.display = 'none';
            document.getElementById('reportPass').value = '';
        }

        function saveProduct() {
            let barcode = document.getElementById('pBarcode').value.trim();
            let name = document.getElementById('pName').value.trim();
            let price = parseFloat(document.getElementById('pPrice').value) || 0;
            let qty = parseInt(document.getElementById('pQty').value) || 0;

            if(!barcode && !name) {
                alert('يرجى إدخال الباركود أو اسم الصنف');
                return;
            }

            let existing = products.find(p => (barcode && p.barcode === barcode) || (name && p.name.toLowerCase() === name.toLowerCase()));
            if(existing) {
                existing.qty += qty;
                if(price > 0) existing.price = price;
                if(name) existing.name = name;
                if(barcode) existing.barcode = barcode;
                alert('تم تحديث كمية الصنف بنجاح! الكمية الحالية: ' + existing.qty);
            } else {
                products.push({ id: Date.now(), barcode, name: name || 'صنف بدون اسم', price, qty });
                alert('تم حفظ الصنف الجديد بنجاح!');
            }

            localStorage.setItem('products', JSON.stringify(products));
            clearProductForm();
            updateProductSelect();
            renderInventoryList();
        }

        function clearProductForm() {
            document.getElementById('pBarcode').value = '';
            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pQty').value = '';
        }

        function updateProductSelect() {
            let select = document.getElementById('productSelect');
            select.innerHTML = '<option value="">-- أو اختر صنفاً من القائمة --</option>';
            products.forEach(p => {
                select.innerHTML += `<option value="${p.id}">${p.name} - السعر: ${p.price}ج.م (متاح: ${p.qty})</option>`;
            });
        }

        function renderInventoryList() {
            let container = document.getElementById('inventoryList');
            container.innerHTML = '';
            if(products.length === 0) {
                container.innerHTML = '<p style="color:#666;">لا توجد أصناف مسجلة بعد.</p>';
                return;
            }
            products.forEach(p => {
                container.innerHTML += `
                    <div style="font-size:14px; padding:6px 0; border-bottom: 1px dashed #ddd; display:flex; justify-content:space-between; align-items:center;">
                        <span><b>${p.name}</b> (باركود: ${p.barcode || 'بدون'})</span>
                        <span>السعر: ${p.price}ج.م | المتاح: <b>${p.qty}</b></span>
                    </div>
                `;
            });
        }

        function filterAndAddProduct() {
            let query = document.getElementById('searchBarcode').value.trim().toLowerCase();
            if(!query) return;
            let found = products.find(p => p.barcode === query || p.name.toLowerCase().includes(query));
            if(found) {
                let cartItem = cart.find(c => c.id == found.id);
                if(cartItem) cartItem.qty++;
                else cart.push({ ...found, qty: 1 });
                renderCart();
                document.getElementById('searchBarcode').value = '';
            }
        }

        function addProductToCart() {
            let id = document.getElementById('productSelect').value;
            if(!id) return;
            let product = products.find(p => p.id == id);
            let cartItem = cart.find(c => c.id == id);
            if(cartItem) cartItem.qty++;
            else cart.push({ ...product, qty: 1 });
            renderCart();
            document.getElementById('productSelect').value = '';
        }

        function renderCart() {
            let container = document.getElementById('cartList');
            container.innerHTML = '';
            let subTotal = 0;
            
            cart.forEach((item, index) => {
                let itemTotal = item.price * item.qty;
                subTotal += itemTotal;
                container.innerHTML += `
                    <div class="item-row">
                        <span><b>${item.name}</b> (${item.price} ج.م)</span>
                        <span>
                            <button onclick="changeCartQty(${index}, -1)" style="width:30px;height:30px;min-height:30px;padding:0;">-</button>
                            <b style="padding: 0 6px;">${item.qty}</b>
                            <button onclick="changeCartQty(${index}, 1)" style="width:30px;height:30px;min-height:30px;padding:0;">+</button>
                            = ${itemTotal} ج.م
                        </span>
                    </div>
                `;
            });

            let discount = parseFloat(document.getElementById('discountVal').value) || 0;
            let paid = parseFloat(document.getElementById('paidVal').value) || 0;
            let finalTotal = Math.max(0, subTotal - discount);
            let change = paid - finalTotal;

            document.getElementById('invoiceSummary').innerHTML = `
                إجمالي الأصناف: ${subTotal} ج.م<br>
                الخصم: ${discount} ج.م<br>
                <b style="color: #7c3aed; font-size: 17px;">الإجمالي النهائي: ${finalTotal} ج.م</b><br>
                <b style="color: ${change < 0 ? '#ef4444' : '#10b981'}; font-size: 17px;">المتبقي / الباقي (السالب): ${change} ج.م</b>
            `;
        }

        function changeCartQty(index, delta) {
            cart[index].qty += delta;
            if(cart[index].qty <= 0) cart.splice(index, 1);
            renderCart();
        }

        function checkoutInvoice() {
            if(cart.length === 0) {
                alert('الفاتورة فارغة!');
                return;
            }
            let clientName = document.getElementById('clientName').value.trim() || 'عميل نقدي';
            let clientPhone = document.getElementById('clientPhone').value.trim() || '-';
            let subTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            let discount = parseFloat(document.getElementById('discountVal').value) || 0;
            let finalTotal = Math.max(0, subTotal - discount);
            let paid = parseFloat(document.getElementById('paidVal').value) || 0;
            let change = paid - finalTotal;

            let now = new Date();
            
            if(editingInvoiceId) {
                let inv = invoices.find(i => i.id === editingInvoiceId);
                if(inv) {
                    inv.clientName = clientName;
                    inv.clientPhone = clientPhone;
                    inv.items = [...cart];
                    inv.subTotal = subTotal;
                    inv.discount = discount;
                    inv.finalTotal = finalTotal;
                    inv.paid = paid;
                    inv.change = change;
                }
                editingInvoiceId = null;
                alert('تم تعديل الفاتورة بنجاح!');
            } else {
                let newInvoice = { 
                    id: Date.now(), 
                    dateStr: now.toISOString().split('T')[0], 
                    timeStr: now.toLocaleTimeString('ar-EG'),
                    dayName: now.toLocaleDateString('ar-EG', { weekday: 'long' }),
                    clientName,
                    clientPhone,
                    items: [...cart], 
                    subTotal, discount, finalTotal, paid, change
                };
                invoices.push(newInvoice);
                
                cart.forEach(cartItem => {
                    let prod = products.find(p => p.id === cartItem.id);
                    if(prod) prod.qty = Math.max(0, prod.qty - cartItem.qty);
                });
                alert('تم إتمام وحفظ الفاتورة بنجاح!');
            }

            localStorage.setItem('invoices', JSON.stringify(invoices));
            localStorage.setItem('products', JSON.stringify(products));

            cart = [];
            document.getElementById('clientName').value = '';
            document.getElementById('clientPhone').value = '';
            document.getElementById('discountVal').value = 0;
            document.getElementById('paidVal').value = 0;
            renderCart();
            updateProductSelect();
        }

        function editInvoice(id) {
            let inv = invoices.find(i => i.id === id);
            if(!inv) return;
            
            editingInvoiceId = inv.id;
            document.getElementById('clientName').value = inv.clientName;
            document.getElementById('clientPhone').value = inv.clientPhone;
            document.getElementById('discountVal').value = inv.discount;
            document.getElementById('paidVal').value = inv.paid;
            cart = [...inv.items];
            
            renderCart();
            switchTab('cashier');
            alert('تم جلب الفاتورة للتعديل في شاشة الكاشير. عدل ما تحتاجه ثم اضغط إتمام وحفظ الفاتورة.');
        }

        // حذف الفاتورة مع إرجاع كمياتها للمخزن إن أمكن
        function deleteInvoice(id) {
            if(confirm('هل أنت متأكد من حذف هذه الفاتورة نهائياً؟')) {
                invoices = invoices.filter(inv => inv.id !== id);
                localStorage.setItem('invoices', JSON.stringify(invoices));
                renderDailyInvoices();
                alert('تم حذف الفاتورة بنجاح.');
            }
        }

        function shareInvoiceWhatsApp(id) {
            let inv = invoices.find(i => i.id === id);
            if(!inv) return;
            
            let itemsText = inv.items.map(i => `- ${i.name} (×${i.qty}) = ${i.price * i.qty}ج`).join('\n');
            let text = `🛒 *مول الصعيدي* \n📅 فاتورة بتاريخ: ${inv.dateStr} (${inv.timeStr})\n👤 العميل: ${inv.clientName} (${inv.clientPhone})\n\n*الأصناف المباعة:*\n${itemsText}\n\nالإجمالي: ${inv.finalTotal} ج.م\nالمدفوع: ${inv.paid} ج.م\nالمتبقي: ${inv.change} ج.م`;
            
            let url = `https://wa.me/?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        function shareDailyReportWhatsApp() {
            let selectedDate = document.getElementById('dailyDate').value;
            let filtered = invoices.filter(inv => inv.dateStr === selectedDate);
            let totalSales = filtered.reduce((sum, inv) => sum + inv.finalTotal, 0);

            let text = `📊 *تقرير مبيعات مول الصعيدي* \n📅 التاريخ: ${selectedDate}\n💰 إجمالي المبيعات: ${totalSales} ج.م\n🧾 عدد الفواتير: ${filtered.length}\n\nتم استخراج التقرير من النظام بنجاح.`;
            let url = `https://wa.me/?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        function renderDailyInvoices() {
            let selectedDate = document.getElementById('dailyDate').value;
            let container = document.getElementById('dailyInvoicesContainer');
            container.innerHTML = '';
            
            let filtered = invoices.filter(inv => inv.dateStr === selectedDate);
            let totalDaySales = filtered.reduce((sum, inv) => sum + inv.finalTotal, 0);

            let headerHtml = `
                <div style="background:#ede9fe; padding:10px; border-radius:10px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
                    <span>إجمالي مبيعات اليوم: <b>${totalDaySales} ج.م</b> (${filtered.length} فاتورة)</span>
                    <button class="btn-whatsapp" style="width:auto; min-height:36px; padding:4px 10px; font-size:13px;" onclick="shareDailyReportWhatsApp()">📤 مشاركة التقرير واتساب</button>
                </div>
            `;

            if(filtered.length === 0) {
                container.innerHTML = headerHtml + '<p style="color:#666;">لا توجد فواتير في هذا التاريخ.</p>';
                return;
            }

            let html = headerHtml;
            filtered.forEach((inv, invIndex) => {
                let itemsHtml = inv.items.map(i => `<div class="item-row"><span>${i.name} (×${i.qty})</span><span>${i.price * i.qty} ج.م</span></div>`).join('');
                html += `
                    <div class="invoice-card">
                        <div class="invoice-header">
                            <span>فاتورة #${invIndex + 1} (${inv.timeStr}) - ${inv.clientName}</span>
                            <span style="color:#7c3aed;">النهائي: ${inv.finalTotal} ج.م</span>
                        </div>
                        ${itemsHtml}
                        <div style="font-size: 13px; margin-top: 6px; color: #4b5563;">
                            الخصم: ${inv.discount || 0} ج.م | المدفوع: ${inv.paid || 0} ج.م | المتبقي (الباقي/السالب): <b style="color:${inv.change < 0 ? '#ef4444':'#10b981'}">${inv.change} ج.م</b>
                        </div>
                        <div class="row" style="margin-top: 8px; display: flex; gap: 4px;">
                            <button class="btn-info" style="flex: 1; font-size: 13px;" onclick="editInvoice(${inv.id})">تعديل</button>
                            <button class="btn-whatsapp" style="flex: 1; font-size: 13px;" onclick="shareInvoiceWhatsApp(${inv.id})">واتساب</button>
                            <button class="btn-danger" style="flex: 1; font-size: 13px;" onclick="deleteInvoice(${inv.id})">حذف</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function generateReport() {
            let selectedDate = document.getElementById('reportDate').value;
            if(!selectedDate) return;

            let filtered = invoices.filter(inv => inv.dateStr === selectedDate);
            let totalSales = filtered.reduce((sum, inv) => sum + inv.finalTotal, 0);

            let html = `
                <h4>📅 تقارير يوم: ${selectedDate}</h4>
                <p><b>إجمالي المبيعات:</b> ${totalSales} ج.م</p>
                <p><b>عدد الفواتير:</b> ${filtered.length}</p>
            `;
            document.getElementById('reportResult').innerHTML = html;
        }

        updateProductSelect();
        renderCart();
    </script>
</body>
</html>
