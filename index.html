*{box-sizing:border-box}body{margin:0;padding:14px;max-width:760px;margin-inline:auto;background:#f5f3ff;color:#211b2d;font-family:system-ui,sans-serif}h1{text-align:center;color:#6d28d9;font-size:23px;margin:5px 0 15px}h2{font-size:18px;color:#5b21b6;margin:0 0 12px}h3{font-size:16px;color:#5b21b6}section{background:#fff;padding:14px;border-radius:15px;box-shadow:0 3px 14px #0000000d;margin-bottom:14px}.tabs{display:flex;gap:4px;overflow:auto;background:#ede9fe;padding:5px;border-radius:13px;margin-bottom:14px}.tabs button{flex:1;white-space:nowrap;font-size:13px;padding:8px 10px;background:transparent;color:#5b21b6;min-width:80px}.tabs button.active{background:#7c3aed;color:#fff}.content{display:none}.content.active{display:block}input,select,button{width:100%;min-height:44px;margin:5px 0;padding:10px 12px;border:1px solid #ddd6e8;border-radius:10px;font-size:15px;background:#fff}button{border:0;background:#7c3aed;color:white;font-weight:700;cursor:pointer}.danger{background:#ef4444}.success{background:#10b981}.info{background:#3b82f6}.warning{background:#f59e0b}.green{background:#25d366}.row{display:flex;gap:7px}.row>*{min-width:0;flex:1}.card{border:1px solid #e9d5ff;background:#faf5ff;border-radius:11px;padding:10px;margin:8px 0}.line{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed #e9d5ff;align-items:center}.small{font-size:12px;color:#655b70}.summary{background:#faf5ff;border:1px solid #e9d5ff;border-radius:11px;padding:10px;line-height:1.8}.video{display:none;background:#111;border-radius:12px;overflow:hidden;margin:8px 0}.video video{width:100%;max-height:240px;object-fit:cover}.status{padding:9px;border-radius:9px;background:#f3e8ff;margin:8px 0;font-size:13px}#printArea{display:none}@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{display:block;position:absolute;top:0;right:0;width:100%;padding:12px;background:#fff;color:#000}}
</style></head><body>
<h1>مول الصعيدي 🛒</h1><div id="connectionStatus" class="status">جاري الاتصال بقاعدة البيانات...</div>
<div class="tabs"><button class="active" id="btn-cashier" onclick="switchTab('cashier')">🛒 الكاشير</button><button id="btn-inventory" onclick="switchTab('inventory')">📦 المخزن</button><button id="btn-daily" onclick="switchTab('daily')">📅 الفواتير</button><button id="btn-reports" onclick="switchTab('reports')">📊 التقارير</button></div>
<div id="tab-cashier" class="content active"><section><h2>البيع والفاتورة</h2><div class="row"><input id="clientName" placeholder="اسم العميل"><input id="clientPhone" inputmode="tel" placeholder="رقم الهاتف"></div><div id="camera-cashier" class="video"><video id="video-cashier" muted autoplay playsinline></video></div><button class="info" onclick="startCamera('cashier')">📷 مسح باركود للبيع</button><input id="searchBarcode" placeholder="ابحث بالباركود أو اسم الصنف" oninput="updateProductSelect()"><select id="productSelect" onchange="addSelectedProduct()"><option value="">اختر صنفًا</option></select><div id="cartList"></div><div class="row"><div><label>الخصم (ج.م)</label><input id="discountVal" type="number" min="0" value="0" oninput="renderCart()"></div><div><label>المدفوع (ج.م)</label><input id="paidVal" type="number" min="0" value="0" oninput="renderCart()"></div></div><div id="invoiceSummary" class="summary"></div><button onclick="checkoutInvoice()">حفظ وإتمام البيع</button><button class="danger" onclick="clearCart()">تفريغ الفاتورة</button></section></div>
<div id="tab-inventory" class="content"><section><h2>إدارة المخزن</h2><div id="camera-inventory" class="video"><video id="video-inventory" muted autoplay playsinline></video></div><button class="info" onclick="startCamera('inventory')">📷 مسح باركود الصنف</button><input type="hidden" id="pDocId"><input id="pBarcode" placeholder="الباركود"><input id="pName" placeholder="اسم الصنف"><div class="row"><input id="pPrice" type="number" min="0" placeholder="السعر"><input id="pQty" type="number" min="0" step="1" placeholder="الكمية"></div><button class="success" id="saveProductBtn" onclick="saveProduct()">حفظ الصنف</button><button class="danger" id="cancelEditBtn" style="display:none" onclick="resetProductForm()">إلغاء التعديل</button><input id="inventorySearch" placeholder="بحث في المخزن" oninput="renderInventoryList()"><div id="inventoryList"></div></section></div>
<div id="tab-daily" class="content"><section><h2>الفواتير اليومية</h2><label>التاريخ</label><input type="date" id="dailyDate" onchange="renderDailyInvoices()"><div class="row"><button class="green" onclick="shareDailyReportWhatsApp()">مشاركة واتساب</button><button class="info" onclick="downloadDailyReportFile()">تحميل CSV</button></div><div id="dailyInvoicesContainer"></div></section></div>
<div id="tab-reports" class="content"><section><h2>كشف الحساب</h2><div id="passSection"><input type="password" id="reportPass" placeholder="كلمة مرور التقارير"><button class="warning" onclick="unlockReports()">فتح التقارير</button><div class="small">تنبيه: كلمة المرور داخل الصفحة ليست حماية حقيقية للبيانات.</div></div><div id="reportsContent" style="display:none"><button class="danger" onclick="lockReports()">قفل التقارير</button><label>التاريخ</label><input type="date" id="reportDate" onchange="generateReport()"><div id="reportResult" class="summary"></div><button class="info" onclick="exportBackup()">تنزيل نسخة JSON من البيانات المحملة</button></div></section></div>
<div id="printArea"></div>
<script>
const firebaseConfig={apiKey:"AIzaSyB9EWlVr5e72lZqF_a0pne0U",authDomain:"alsaeedy-mall.firebaseapp.com",projectId:"alsaeedy-mall",storageBucket:"alsaeedy-mall.firebasestorage.app",messagingSenderId:"542292216756",appId:"1:542292216756:web:7dbfa21e46b7"};
const REPORT_PASSWORD="1760";let db,products=[],invoices=[],cart=[],reader=null,busy=false;
const $=id=>document.getElementById(id);const money=n=>(Number(n)||0).toLocaleString('ar-EG',{maximumFractionDigits:2})+' ج.م';const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function setStatus(msg,ok=false){$('connectionStatus').textContent=msg;$('connectionStatus').style.background=ok?'#dcfce7':'#fee2e2'}
try{if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);db=firebase.firestore();db.enablePersistence({synchronizeTabs:true}).catch(()=>{});loadDataFromCloud()}catch(e){setStatus('تعذر تهيئة Firebase: '+e.message)}

async function loadDataFromCloud(){if(!db)return;try{const [ps,is]=await Promise.all([db.collection('products').get(),db.collection('invoices').get()]);products=ps.docs.map(d=>({docId:d.id,...d.data()}));invoices=is.docs.map(d=>({docId:d.id,...d.data()}));updateProductSelect();renderCart();renderInventoryList();renderDailyInvoices();generateReport();setStatus(`تم الاتصال بالسحابة. الأصناف: ${products.length} — الفواتير: ${invoices.length}`,true)}catch(e){setStatus('فشل تحميل البيانات: '+e.message+' — راجع الإنترنت وقواعد Firestore');console.error(e)}}
function switchTab(id){stopCamera();document.querySelectorAll('.content').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));$('tab-'+id).classList.add('active');$('btn-'+id).classList.add('active');if(id==='inventory')renderInventoryList();if(id==='daily'){if(!$('dailyDate').value)$('dailyDate').value=today();renderDailyInvoices()}if(id==='reports'&&$('reportsContent').style.display==='block')generateReport()}
function updateProductSelect(){let q=$('searchBarcode').value.trim().toLowerCase();let list=products.filter(p=>!q||String(p.barcode||'').toLowerCase().includes(q)||String(p.name||'').toLowerCase().includes(q));$('productSelect').innerHTML='<option value="">اختر صنفًا</option>'+list.map(p=>`<option value="${esc(p.docId)}">${esc(p.name||'بدون اسم')} — ${money(p.price)} — المتاح ${Number(p.qty)||0}</option>`).join('')}
function addSelectedProduct(){let p=products.find(x=>x.docId===$('productSelect').value);if(!p)return;addProduct(p);$('productSelect').value='';$('searchBarcode').value='';updateProductSelect()}
function addProduct(p){let item=cart.find(x=>x.docId===p.docId);let already=item?item.qty:0;if(already+1>(Number(p.qty)||0)){alert('الكمية المتاحة لا تكفي. المتاح: '+(Number(p.qty)||0));return}if(item)item.qty++;else cart.push({...p,qty:1});renderCart()}
function renderCart(){let html='';cart.forEach((p,i)=>{html+=`<div class="card"><div class="line"><b>${esc(p.name)}</b><span>${money(p.price)} × ${p.qty}</span></div><div class="row"><button onclick="changeQty(${i},-1)">−</button><button onclick="changeQty(${i},1)">+</button><button class="danger" onclick="removeCartItem(${i})">حذف</button></div></div>`});$('cartList').innerHTML=html||'<div class="small">الفاتورة فارغة</div>';let subtotal=cart.reduce((s,p)=>s+(Number(p.price)||0)*p.qty,0),discount=Math.max(0,Number($('discountVal').value)||0),total=Math.max(0,subtotal-discount),paid=Math.max(0,Number($('paidVal').value)||0);$('invoiceSummary').innerHTML=`إجمالي الأصناف: ${money(subtotal)}<br>الخصم: ${money(discount)}<br><b>الإجمالي النهائي: ${money(total)}</b><br>المدفوع: ${money(paid)}<br><b>المتبقي: ${money(Math.max(0,total-paid))} — الباقي للعميل: ${money(Math.max(0,paid-total))}</b>`}
function changeQty(i,delta){let p=cart[i],prod=products.find(x=>x.docId===p.docId);let next=p.qty+delta;if(next<1){cart.splice(i,1)}else if(delta>0&&next>(Number(prod?.qty)||0)){alert('الكمية المتاحة لا تكفي');return}else p.qty=next;renderCart()}function removeCartItem(i){cart.splice(i,1);renderCart()}function clearCart(){if(confirm('تفريغ الفاتورة الحالية؟')){cart=[];$('discountVal').value=0;$('paidVal').value=0;$('clientName').value='';$('clientPhone').value='';renderCart()}}

async function checkoutInvoice(){
  if(busy)return;
  if(!db){alert('قاعدة البيانات غير متاحة');return}
  if(!cart.length){alert('أضف أصنافًا أولًا');return}
  let subtotal=cart.reduce((s,p)=>s+(Number(p.price)||0)*p.qty,0),discount=Math.max(0,Number($('discountVal').value)||0);
  if(discount>subtotal){alert('الخصم لا يمكن أن يتجاوز إجمالي الأصناف');return}
  let total=subtotal-discount,paid=Math.max(0,Number($('paidVal').value)||0);
  const invoiceRef=db.collection('invoices').doc();
  const items=cart.map(p=>({productDocId:p.docId,id:p.id||null,barcode:p.barcode||'',name:p.name,price:Number(p.price)||0,qty:p.qty,lineTotal:(Number(p.price)||0)*p.qty}));
  let invoice={invoiceNo:invoiceRef.id.slice(-8).toUpperCase(),clientName:$('clientName').value.trim(),clientPhone:$('clientPhone').value.trim(),items,subtotal,discount,total,paid,remaining:Math.max(0,total-paid),change:Math.max(0,paid-total),createdAt:firebase.firestore.FieldValue.serverTimestamp(),date:today(),branch:'مول الصعيدي'};
  busy=true;
  setStatus('جاري حفظ الفاتورة وتحديث المخزون...');
  try{
    await db.runTransaction(async tx=>{
      let refs=cart.map(p=>db.collection('products').doc(p.docId));
      let snaps=[];
      for(const ref of refs)snaps.push(await tx.get(ref));
      snaps.forEach((snap,i)=>{
        if(!snap.exists)throw new Error('صنف لم يعد موجودًا بالمخزن');
        let qty=Number(snap.data().qty)||0;
        if(qty<cart[i].qty)throw new Error('الكمية غير كافية للصنف: '+(snap.data().name||''))
      });
      snaps.forEach((snap,i)=>tx.update(refs[i],{qty:(Number(snap.data().qty)||0)-cart[i].qty}));
      tx.set(invoiceRef,invoice)
    });
    alert('تم حفظ الفاتورة وتحديث المخزون بنجاح');
    printInvoice({...invoice,docId:invoiceRef.id,createdAt:new Date()});
    cart=[];
    $('discountVal').value=0;
    $('paidVal').value=0;
    $('clientName').value='';
    $('clientPhone').value='';
    await loadDataFromCloud(); // تحديث تلقائي فوري
  }catch(e){
    alert('لم يتم تأكيد حفظ الفاتورة: '+e.message);
    setStatus('فشل حفظ الفاتورة: '+e.message);
    console.error(e);
  }finally{
    busy=false;
  }
}

async function saveProduct(){
  if(!db)return alert('قاعدة البيانات غير متاحة');
  let docId=$('pDocId').value,barcode=$('pBarcode').value.trim(),name=$('pName').value.trim(),price=Number($('pPrice').value),qty=Number($('pQty').value);
  if(!name)return alert('اكتب اسم الصنف');
  if(!Number.isFinite(price)||price<0||!Number.isInteger(qty)||qty<0)return alert('تأكد من السعر والكمية');
  try{
    let dup=products.find(p=>(barcode&&p.barcode===barcode||p.name?.trim().toLowerCase()===name.toLowerCase())&&p.docId!==docId);
    if(dup&&!docId){
      if(!confirm('الصنف موجود بالفعل. هل تريد إضافة الكمية وتحديث السعر؟'))return;
      await db.collection('products').doc(dup.docId).update({qty:(Number(dup.qty)||0)+qty,price,barcode:barcode||dup.barcode||''});
    }else if(docId){
      await db.collection('products').doc(docId).update({barcode,name,price,qty});
    }else{
      await db.collection('products').add({id:Date.now(),barcode,name,price,qty,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    }
    alert('تم الحفظ في السحابة');
    resetProductForm();
    await loadDataFromCloud(); // تحديث تلقائي فوري
  }catch(e){
    alert('فشل حفظ الصنف: '+e.message);
    setStatus('فشل حفظ الصنف: '+e.message);
  }
}

function editProduct(id){let p=products.find(x=>x.docId===id);if(!p)return;$('pDocId').value=p.docId;$('pBarcode').value=p.barcode||'';$('pName').value=p.name||'';$('pPrice').value=p.price??0;$('pQty').value=p.qty??0;$('saveProductBtn').textContent='حفظ التعديل';$('cancelEditBtn').style.display='block';window.scrollTo({top:0,behavior:'smooth'})}
function resetProductForm(){['pDocId','pBarcode','pName','pPrice','pQty'].forEach(id=>$(id).value='');$('saveProductBtn').textContent='حفظ الصنف';$('cancelEditBtn').style.display='none'}

async function deleteProduct(id){
  if(!confirm('حذف الصنف من المخزن؟ لا يمكن التراجع عن الحذف.'))return;
  try{
    await db.collection('products').doc(id).delete();
    await loadDataFromCloud(); // تحديث تلقائي فوري
  }catch(e){
    alert('تعذر حذف الصنف: '+e.message);
  }
}

function renderInventoryList(){let q=($('inventorySearch')?.value||'').trim().toLowerCase();let list=products.filter(p=>!q||String(p.name||'').toLowerCase().includes(q)||String(p.barcode||'').toLowerCase().includes(q));$('inventoryList').innerHTML=list.map(p=>`<div class="card"><div class="line"><b>${esc(p.name||'بدون اسم')}</b><span>${money(p.price)}</span></div><div class="small">باركود: ${esc(p.barcode||'—')} | الكمية: ${Number(p.qty)||0}</div><div class="row"><button onclick="editProduct('${esc(p.docId)}')">تعديل</button><button class="danger" onclick="deleteProduct('${esc(p.docId)}')">حذف</button></div></div>`).join('')||'<div class="small">لا توجد أصناف مطابقة</div>'}
function invoiceDate(inv){if(inv.date)return String(inv.date).slice(0,10);let d=inv.createdAt?.toDate?inv.createdAt.toDate():inv.createdAt?.seconds?new Date(inv.createdAt.seconds*1000):null;return d?todayFrom(d):''}function todayFrom(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function renderDailyInvoices(){if(!$('dailyDate').value)$('dailyDate').value=today();let date=$('dailyDate').value,list=invoices.filter(i=>invoiceDate(i)===date).sort((a,b)=>String(b.invoiceNo||'').localeCompare(String(a.invoiceNo||'')));$('dailyInvoicesContainer').innerHTML=list.map(i=>invoiceCard(i)).join('')||'<div class="small">لا توجد فواتير في هذا التاريخ</div>'}
function invoiceCard(i){let d=i.createdAt?.toDate?i.createdAt.toDate():i.createdAt?.seconds?new Date(i.createdAt.seconds*1000):null;return `<div class="card"><div class="line"><b>فاتورة ${esc(i.invoiceNo||i.docId||'')}</b><b>${money(i.total)}</b></div><div class="small">${esc(i.clientName||'عميل نقدي')} — ${esc(i.clientPhone||'بدون هاتف')} ${d?'— '+d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}):''}</div><div class="small">عدد الأصناف: ${(i.items||[]).reduce((s,x)=>s+(Number(x.qty)||0),0)} | المدفوع: ${money(i.paid)} | المتبقي: ${money(i.remaining)}</div><button onclick="printSavedInvoice('${esc(i.docId)}')">طباعة الفاتورة</button></div>`}
function selectedInvoices(){let date=$('dailyDate').value||today();return invoices.filter(i=>invoiceDate(i)===date).sort((a,b)=>{let da=a.createdAt?.toDate?a.createdAt.toDate():a.createdAt?.seconds?new Date(a.createdAt.seconds*1000):new Date(0);let db=b.createdAt?.toDate?b.createdAt.toDate():b.createdAt?.seconds?new Date(b.createdAt.seconds*1000):new Date(0);return da-db})}
function getDailyReportText(){
    const list=selectedInvoices(),date=$('dailyDate').value||today();
    const dateFormatted=date.split('-').reverse().join('-');
    const total=list.reduce((s,i)=>s+(Number(i.total)||0),0);
    const paid=list.reduce((s,i)=>s+(Number(i.paid)||0),0);
    const remaining=list.reduce((s,i)=>s+(Number(i.remaining)||0),0);
    const discount=list.reduce((s,i)=>s+(Number(i.discount)||0),0);
    let report=`📊 *تقرير مبيعات مول الصعيدي*
📅 التاريخ: *${dateFormatted}*

━━━━━━━━━━━━━━━━━━
📈 *ملخص اليوم*
💰 إجمالي المبيعات: *${money(total)}*
🧾 عدد الفواتير: *${list.length}*
🏷️ إجمالي الخصومات: *${money(discount)}*
💵 إجمالي المدفوع: *${money(paid)}*
⏳ إجمالي المتبقي: *${money(remaining)}*
━━━━━━━━━━━━━━━━━━

`;
    if(!list.length)return report+'لا توجد فواتير في هذا اليوم.';
    list.forEach((inv,index)=>{
        const items=Array.isArray(inv.items)?inv.items:[];
        const subtotal=Number(inv.subtotal??items.reduce((s,x)=>s+(Number(x.lineTotal??(Number(x.price||0)*Number(x.qty||0)))||0),0));
        const disc=Number(inv.discount)||0;
        const finalTotal=Number(inv.total??Math.max(0,subtotal-disc));
        const invoicePaid=Number(inv.paid)||0;
        const invoiceRemaining=Number(inv.remaining??Math.max(0,finalTotal-invoicePaid));
        const invoiceChange=Number(inv.change)||0;
        const created=inv.createdAt?.toDate?inv.createdAt.toDate():inv.createdAt?.seconds?new Date(inv.createdAt.seconds*1000):null;
        const time=created?created.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}):'—';
        report+=`🧾 *الفاتورة رقم ${index+1}*
🔢 رقم الفاتورة: ${inv.invoiceNo||'—'}
🕒 الوقت: ${time}
👤 العميل: ${inv.clientName||'عميل نقدي'}`;
        if(inv.clientPhone)report+=`\n📞 الهاتف: ${inv.clientPhone}`;
        report+=`

📦 *الأصناف المباعة*
──────────────────
`;
        if(!items.length){
            report+='لا توجد أصناف مسجلة في الفاتورة.\n';
        }else{
            items.forEach((item,itemIndex)=>{
                const qty=Number(item.qty)||0;
                const price=Number(item.price)||0;
                const lineTotal=Number(item.lineTotal??(price*qty));
                report+=`
*${itemIndex+1}. ${item.name||'صنف بدون اسم'}*
   الكمية: ${qty}
   سعر القطعة: ${money(price)}
   إجمالي الصنف: *${money(lineTotal)}*
`;
            });
        }
        report+=`
──────────────────
💵 *ملخص الحساب*
إجمالي الأصناف: ${money(subtotal)}
الخصم: ${money(disc)}
*الإجمالي النهائي: ${money(finalTotal)}*
المدفوع: ${money(invoicePaid)}
المتبقي على العميل: *${money(invoiceRemaining)}*`;
        if(invoiceChange>0)report+=`\nالباقي للعميل: *${money(invoiceChange)}*`;
        report+=`
━━━━━━━━━━━━━━━━━━

`;
    });
    return report+'❤️ شكراً لتعاملكم مع مول الصعيدي';
}
function shareDailyReportWhatsApp(){const textMsg=getDailyReportText();window.open('https://wa.me/?text='+encodeURIComponent(textMsg),'_blank')}
function downloadDailyReportFile(){let list=selectedInvoices();let rows=[['رقم الفاتورة','التاريخ','العميل','الهاتف','الإجمالي','الخصم','المدفوع','المتبقي'],...list.map(i=>[i.invoiceNo||i.docId,invoiceDate(i),i.clientName||'',i.clientPhone||'',i.total||0,i.discount||0,i.paid||0,i.remaining||0])];downloadText('report-'+($('dailyDate').value||today())+'.csv','\ufeff'+rows.map(r=>r.map(csv).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function unlockReports(){if($('reportPass').value===REPORT_PASSWORD){$('passSection').style.display='none';$('reportsContent').style.display='block';$('reportDate').value=today();generateReport()}else alert('كلمة المرور غير صحيحة')}function lockReports(){$('passSection').style.display='block';$('reportsContent').style.display='none';$('reportPass').value=''}function generateReport(){if(!$('reportResult'))return;let date=$('reportDate').value||today(),list=invoices.filter(i=>invoiceDate(i)===date),total=list.reduce((s,i)=>s+(Number(i.total)||0),0),paid=list.reduce((s,i)=>s+(Number(i.paid)||0),0),discount=list.reduce((s,i)=>s+(Number(i.discount)||0),0),remaining=list.reduce((s,i)=>s+(Number(i.remaining)||0),0);$('reportResult').innerHTML=`<b>تقرير يوم ${date}</b><br>عدد الفواتير: ${list.length}<br>إجمالي المبيعات: ${money(total)}<br>إجمالي الخصومات: ${money(discount)}<br>إجمالي المدفوع: ${money(paid)}<br>إجمالي المتبقي: ${money(remaining)}<hr><b>ملخص الشهر</b><br>${monthSummary(date)}`}
function monthSummary(date){let month=date.slice(0,7),list=invoices.filter(i=>invoiceDate(i).startsWith(month)),total=list.reduce((s,i)=>s+(Number(i.total)||0),0),paid=list.reduce((s,i)=>s+(Number(i.paid)||0),0);return `عدد الفواتير: ${list.length}<br>المبيعات: ${money(total)}<br>المدفوع: ${money(paid)}<br>المتبقي: ${money(list.reduce((s,i)=>s+(Number(i.remaining)||0),0))}`}
function printSavedInvoice(id){let i=invoices.find(x=>x.docId===id);if(i)printInvoice(i)}function printInvoice(i){let d=i.createdAt?.toDate?i.createdAt.toDate():i.createdAt instanceof Date?i.createdAt:new Date();$('printArea').innerHTML=`<div style="font-family:Arial,sans-serif;direction:rtl"><h2 style="text-align:center">مول الصعيدي</h2><p>رقم الفاتورة: ${esc(i.invoiceNo||i.docId||'')}</p><p>التاريخ: ${d.toLocaleString('ar-EG')}</p><p>العميل: ${esc(i.clientName||'عميل نقدي')} — ${esc(i.clientPhone||'')}</p><hr>${(i.items||[]).map(x=>`<p>${esc(x.name)} — ${x.qty} × ${money(x.price)} = ${money(x.lineTotal??x.qty*x.price)}</p>`).join('')}<hr><p>الإجمالي: ${money(i.subtotal)}</p><p>الخصم: ${money(i.discount)}</p><h3>الصافي: ${money(i.total)}</h3><p>المدفوع: ${money(i.paid)} — المتبقي: ${money(i.remaining)}</p><hr><p>المرتجع خلال 3 أيام، والاستبدال خلال أسبوع وفق سياسة المحل.</p><p style="text-align:center">شكرًا لزيارتكم</p></div>`;window.print()}
function exportBackup(){let data={exportedAt:new Date().toISOString(),products,invoices};downloadText('mall-saeedy-backup-'+today()+'.json',JSON.stringify(data,null,2),'application/json')}
function downloadText(name,text,type){let blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}function csv(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function startCamera(mode){try{stopCamera();if(!window.ZXing){alert('مكتبة الباركود لم يتم تحميلها');return}let container=$('camera-'+mode),video=$('video-'+mode);container.style.display='block';reader=new ZXing.BrowserMultiFormatReader();reader.decodeFromVideoDevice(undefined,video,(result,err)=>{if(result){let code=result.getText();stopCamera();if(mode==='inventory'){$('pBarcode').value=code;let p=products.find(x=>x.barcode===code);if(p)editProduct(p.docId);else alert('باركود جديد. أكمل بيانات الصنف ثم احفظ.')}else{let p=products.find(x=>String(x.barcode||'')===code);if(p)addProduct(p);else alert('الباركود غير مسجل بالمخزن: '+code)}}})}catch(e){stopCamera();alert('تعذر تشغيل الكاميرا. اسمح للموقع باستخدام الكاميرا وافتحه عبر HTTPS. '+e.message)}}function stopCamera(){try{if(reader)reader.reset()}catch(e){}reader=null;['cashier','inventory'].forEach(m=>{let c=$('camera-'+m);if(c)c.style.display='none'})}
$('dailyDate').value=today();$('reportDate').value=today();renderCart();
