<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#7c3aed">
    <title>مول الصعيدي - الكاشير والتقارير</title>
    <!-- مكتبة قراءة الباركود عبر الكاميرا -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: system-ui, sans-serif; background: #f5f3ff;
            color: #211b2d; padding: 16px; max-width: 720px; margin-inline: auto;
        }
        h1 { margin: 4px 0 16px; font-size: 24px; color: #6d28d9; text-align: center; }
        h2 { font-size: 18px; margin: 0 0 12px; color: #5b21b6; }
        section {
            background: white; padding: 16px; border-radius: 16px;
            margin-bottom: 16px; box-shadow: 0 3px 14px rgba(0,0,0,0.06);
        }
        input, button, select {
            width: 100%; min-height: 48px; margin: 5px 0; padding: 10px 14px;
            border: 1px solid #ddd6e8; border-radius: 12px; font-size: 16px; background: #fff;
        }
        button {
            background: #7c3aed; color: white; border: none; font-weight: bold; cursor: pointer;
        }
        button:active { background: #6d28d9; }
        .btn-danger { background: #ef4444; }
        .btn-success { background: #10b981; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-info { background: #3b82f6; color: white; }
        .row { display: flex; gap: 8px; }
        .invoice-card {
            border: 1px solid #e9d5ff; padding: 12px; border-radius: 12px; margin-bottom: 10px; background: #faf5ff;
        }
        .invoice-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 6px; }
        .item-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed #f3e8ff; font-size: 14px; align-items: center; }
        .report-box { background: #f3e8ff; border: 1px solid #c084fc; padding: 12px; border-radius: 12px; margin-top: 10px; }
        #videoContainer { display: none; width: 100%; max-height: 250px; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 10px; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <h1>مول الصعيدي 🛒</h1>

    <!-- قسم إدارة الأصناف والمخزون مع كاميرا الباركود -->
    <section>
        <h2>إدارة المخزون والأصناف (بالكاميرا)</h2>
        <div id="videoContainer">
            <video id="interactive" muted autoplay></video>
            <button class="btn-danger" style="position: absolute; bottom: 10px; left: 10px; width: auto; min-height: 36px; padding: 0 16px;" onclick="stopCamera()">إغلاق الكاميرا</button>
        </div>
        <button class="btn-info" onclick="startCamera()">📷 فتح الكاميرا لمسح الباركود</button>
        
        <input type="text" id="pBarcode" placeholder="باركود الصنف (يظهر تلقائياً عند المسح أو اكتبه)">
        <input type="text" id="pName" placeholder="اسم الصنف">
        <div class="row">
            <input type="number" id="pPrice" placeholder="السعر">
            <input type="number" id="pQty" placeholder="العدد المراد إضافته">
        </div>
        <button class="btn-success" onclick="saveProduct()">حفظ / تحديث الكمية للصنف</button>
    </section>

    <!-- قسم المبيعات / الفاتورة المحسّن -->
    <section>
        <h2>شاشة الكاشير والفواتير</h2>
        <input type="text" id="searchBarcode" placeholder="ابحث بالباركود أو اسم الصنف..." oninput="filterAndAddProduct()">
        <select id="productSelect" onchange="addProductToCart()"></select>
        
        <div id="cartList" style="margin-top: 10px;"></div>
        
        <div style="background: #faf5ff; padding: 10px; border-radius: 12px; margin-top: 10px; border: 1px solid #e9d5ff;">
            <div class="row">
                <input type="number" id="discountVal" placeholder="قيمة الخصم (ج.م)" oninput="renderCart()" value="0">
                <input type="number" id="paidVal" placeholder="المبلغ المدفوع (ج.م)" oninput="renderCart()" value="0">
            </div>
            <div id="invoiceSummary" style="font-size: 15px; margin-top: 8px; line-height: 1.6;">
                إجمالي الأصناف: 0 ج.م<br>
                الخصم: 0 ج.م<br>
                <b style="color: #7c3aed; font-size: 17px;">الإجمالي النهائي: 0 ج.م</b><br>
                <b style="color: #10b981; font-size: 17px;">المتبقي (الباقي للعميل): 0 ج.م</b>
            </div>
        </div>

        <button onclick="checkoutInvoice()" style="margin-top: 10px;">إتمام وحفظ الفاتورة</button>
    </section>

    <!-- قسم كشف الحساب والتقرير اليومي المحمي بكلمة السر 1760 -->
    <section>
        <h2>📊 كشف الحساب والتقارير (محمي)</h2>
        <div id="passSection">
            <input type="password" id="reportPass" placeholder="أدخل كلمة السر (1760) لرؤية كشف الحساب">
            <button class="btn-warning" onclick="unlockReports()">فتح كشف الحساب</button>
        </div>

        <div id="reportsContent" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0; color: #6d28d9;">التقرير اليومي والشهري</h3>
                <button class="btn-danger" style="width: auto; min-height: 36px; padding: 4px 12px;" onclick="lockReports()">قفل</button>
            </div>
            
            <label style="display:block; margin-top:10px; font-weight:bold;">اختر اليوم لعرض الفواتير:</label>
            <input type="date" id="reportDate" onchange="generateDailyReport()">

            <div id="dailyReportResult" class="report-box">
                اختر تاريخاً لعرض كشف حساب اليوم.
            </div>

            <h3 style="margin-top: 20px; color: #5b21b6;">سجل الفواتير العام</h3>
            <div id="invoicesContainer"></div>
        </div>
    </section>

    <script>
        const REPORT_PASSWORD = "1760"; // كلمة السر الجديدة المحددة

        let products = JSON.parse(localStorage.getItem('products') || '[]');
        let cart = [];
        let invoices = JSON.parse(localStorage.getItem('invoices') || '[]');
        let codeReader = null;

        // تشغيل الكاميرا لقراءة الباركود
        function startCamera() {
            document.getElementById('videoContainer').style.display = 'block';
            codeReader = new ZXing.BrowserBarcodeReader();
            codeReader.decodeFromVideoDevice(null, 'interactive', (result, err) => {
                if (result) {
                    let scannedCode = result.text;
                    document.getElementById('pBarcode').value = scannedCode;
                    
                    // البحث عما إذا كان الصنف موجوداً مسبقاً لتسهيل إضافته
                    let existing = products.find(p => p.barcode === scannedCode);
                    if(existing) {
                        document.getElementById('pName').value = existing.name;
                        document.getElementById('pPrice').value = existing.price;
                        alert('تم التعرف على الصنف: ' + existing.name);
                    } else {
                        alert('باركود جديد: ' + scannedCode + ' - أدخل اسمه وسعره لحفظه');
                    }
                    stopCamera();
                }
            }).catch(err => console.error(err));
        }

        function stopCamera() {
            if(codeReader) {
                codeReader.reset();
            }
            document.getElementById('videoContainer').style.display = 'none';
        }

        function unlockReports() {
            let pass = document.getElementById('reportPass').value;
            if(pass === REPORT_PASSWORD) {
                document.getElementById('passSection').style.display = 'none';
                document.getElementById('reportsContent').style.display = 'block';
                document.getElementById('reportDate').valueAsDate = new Date();
                generateDailyReport();
                renderInvoices();
            } else {
                alert('كلمة السر غير صحيحة!');
            }
        }

        function lockReports() {
            document.getElementById('passSection').style.display = 'block';
            document.getElementById('reportsContent').style.display = 'none';
            document.getElementById('reportPass').value = '';
        }

        function saveProduct() {
            let barcode = document.getElementById('pBarcode').value.trim();
            let name = document.getElementById('pName').value.trim();
            let price = parseFloat(document.getElementById('pPrice').value) || 0;
            let qty = parseInt(document.getElementById('pQty').value) || 0;

            if(!barcode && !name) {
                alert('يرجى إدخال الباركود أو اسم الصنف على الأقل');
                return;
            }

            let existing = products.find(p => (barcode && p.barcode === barcode) || (name && p.name === name));
            if(existing) {
                existing.qty += qty; // زيادة العدد مباشرة للصنف الموجود مسبقاً
                if(price > 0) existing.price = price;
                if(name) existing.name = name;
            } else {
                products.push({ id: Date.now(), barcode, name: name || 'صنف بدون اسم', price, qty });
            }

            localStorage.setItem('products', JSON.stringify(products));
            alert('تم حفظ الصنف وتحديث المخزون بنجاح!');
            clearProductForm();
            updateProductSelect();
        }

        function clearProductForm() {
            document.getElementById('pBarcode').value = '';
            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pQty').value = '';
        }

        function updateProductSelect() {
            let select = document.getElementById('productSelect');
            select.innerHTML = '<option value="">-- أو اختر صنفاً من القائمة --</option>';
            products.forEach(p => {
                select.innerHTML += `<option value="${p.id}">${p.name} - السعر: ${p.price}ج.م (متاح: ${p.qty})</option>`;
            });
        }

        function filterAndAddProduct() {
            let query = document.getElementById('searchBarcode').value.trim().toLowerCase();
            if(!query) return;
            
            let found = products.find(p => p.barcode === query || p.name.toLowerCase().includes(query));
            if(found) {
                let cartItem = cart.find(c => c.id == found.id);
                if(cartItem) {
                    cartItem.qty++;
                } else {
                    cart.push({ ...found, qty: 1 });
                }
                renderCart();
                document.getElementById('searchBarcode').value = '';
            }
        }

        function addProductToCart() {
            let id = document.getElementById('productSelect').value;
            if(!id) return;
            let product = products.find(p => p.id == id);
            let cartItem = cart.find(c => c.id == id);

            if(cartItem) {
                cartItem.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            renderCart();
            document.getElementById('productSelect').value = '';
        }

        function renderCart() {
            let container = document.getElementById('cartList');
            container.innerHTML = '';
            let subTotal = 0;
            
            cart.forEach((item, index) => {
                let itemTotal = item.price * item.qty;
                subTotal += itemTotal;
                container.innerHTML += `
                    <div class="item-row">
                        <span><b>${item.name}</b> (${item.price} ج.م)</span>
                        <span>
                            <button onclick="changeCartQty(${index}, -1)" style="width:30px;height:30px;min-height:30px;padding:0;">-</button>
                            <b style="padding: 0 6px;">${item.qty}</b>
                            <button onclick="changeCartQty(${index}, 1)" style="width:30px;height:30px;min-height:30px;padding:0;">+</button>
                            = ${itemTotal} ج.م
                        </span>
                    </div>
                `;
            });

            let discount = parseFloat(document.getElementById('discountVal').value) || 0;
            let paid = parseFloat(document.getElementById('paidVal').value) || 0;
            let finalTotal = Math.max(0, subTotal - discount);
            let change = paid - finalTotal;

            document.getElementById('invoiceSummary').innerHTML = `
                إجمالي الأصناف: ${subTotal} ج.م<br>
                الخصم: ${discount} ج.م<br>
                <b style="color: #7c3aed; font-size: 17px;">الإجمالي النهائي: ${finalTotal} ج.م</b><br>
                <b style="color: #10b981; font-size: 17px;">المتبقي (الباقي للعميل): ${change >= 0 ? change : 0} ج.م</b>
            `;
        }

        function changeCartQty(index, delta) {
            cart[index].qty += delta;
            if(cart[index].qty <= 0) cart.splice(index, 1);
            renderCart();
        }

        function checkoutInvoice() {
            if(cart.length === 0) {
                alert('الفاتورة فارغة!');
                return;
            }
            let subTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            let discount = parseFloat(document.getElementById('discountVal').value) || 0;
            let finalTotal = Math.max(0, subTotal - discount);
            let paid = parseFloat(document.getElementById('paidVal').value) || 0;
            let change = paid - finalTotal;

            let now = new Date();
            let newInvoice = { 
                id: Date.now(), 
                dateStr: now.toISOString().split('T')[0], 
                timeStr: now.toLocaleTimeString('ar-EG'),
                dayName: now.toLocaleDateString('ar-EG', { weekday: 'long' }),
                items: [...cart], 
                subTotal,
                discount,
                finalTotal,
                paid,
                change: change >= 0 ? change : 0
            };

            invoices.push(newInvoice);
            localStorage.setItem('invoices', JSON.stringify(invoices));
            
            // خصم الكميات من المخزون الأساسي تلقائياً
            cart.forEach(cartItem => {
                let prod = products.find(p => p.id === cartItem.id);
                if(prod) {
                    prod.qty = Math.max(0, prod.qty - cartItem.qty);
                }
            });
            localStorage.setItem('products', JSON.stringify(products));

            cart = [];
            document.getElementById('discountVal').value = 0;
            document.getElementById('paidVal').value = 0;
            renderCart();
            updateProductSelect();
            if(document.getElementById('reportsContent').style.display !== 'none') {
                generateDailyReport();
                renderInvoices();
            }
            alert('تم إتمام وحفظ الفاتورة بنجاح!');
        }

        function generateDailyReport() {
            let selectedDate = document.getElementById('reportDate').value;
            if(!selectedDate) return;

            let filteredInvoices = invoices.filter(inv => inv.dateStr === selectedDate);
            let totalSales = filteredInvoices.reduce((sum, inv) => sum + inv.finalTotal, 0);
            let dayName = filteredInvoices.length > 0 ? filteredInvoices[0].dayName : '';

            let html = `
                <h4>📅 كشف يوم: ${selectedDate} ${dayName ? '(' + dayName + ')' : ''}</h4>
                <p><b>إجمالي مبيعات اليوم:</b> ${totalSales} ج.م</p>
                <p><b>عدد الفواتير:</b> ${filteredInvoices.length}</p>
                <hr style="border: 0.5px solid #ddd;">
            `;

            if(filteredInvoices.length === 0) {
                html += '<p style="color: #666;">لا توجد فواتير مسجلة في هذا اليوم.</p>';
            } else {
                filteredInvoices.forEach((inv, index) => {
                    let itemsDetail = inv.items.map(i => `${i.name} (×${i.qty})`).join('، ');
                    html += `
                        <div style="font-size: 13px; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px dashed #c084fc;">
                            <b>فاتورة #${index + 1} (${inv.timeStr}):</b> النهائي: <b>${inv.finalTotal} ج.م</b> (مدفوع: ${inv.paid}, باقي: ${inv.change})
                            <br><small style="color: #555;">الأصناف: ${itemsDetail}</small>
                        </div>
                    `;
                });
            }

            document.getElementById('dailyReportResult').innerHTML = html;
        }

        function renderInvoices() {
            let container = document.getElementById('invoicesContainer');
            container.innerHTML = '';
            invoices.forEach((inv, invIndex) => {
                let itemsHtml = inv.items.map(i => `<div class="item-row"><span>${i.name} (×${i.qty})</span><span>${i.price * i.qty} ج.م</span></div>`).join('');
                container.innerHTML += `
                    <div class="invoice-card">
                        <div class="invoice-header">
                            <span>فاتورة #${invIndex + 1} (${inv.dayName || ''} ${inv.dateStr} - ${inv.timeStr})</span>
                            <span style="color:#7c3aed;">النهائي: ${inv.finalTotal} ج.م</span>
                        </div>
                        ${itemsHtml}
                        <div style="font-size: 13px; margin-top: 6px; color: #4b5563;">
                            الخصم: ${inv.discount || 0} ج.م | المدفوع: ${inv.paid || 0} ج.م | الباقي: ${inv.change || 0} ج.م
                        </div>
                        <div class="row" style="margin-top: 8px;">
                            <button class="btn-danger" onclick="deleteInvoice(${inv.id})">حذف الفاتورة</button>
                        </div>
                    </div>
                `;
            });
        }

        function deleteInvoice(id) {
            if(confirm('هل أنت متأكد من حذف هذه الفاتورة؟')) {
                invoices = invoices.filter(inv => inv.id !== id);
                localStorage.setItem('invoices', JSON.stringify(invoices));
                generateDailyReport();
                renderInvoices();
            }
        }

        updateProductSelect();
        renderCart();
    </script>
</body>
</html>
